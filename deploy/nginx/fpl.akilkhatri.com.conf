# Install on the VPS:
#   sudo cp fpl.akilkhatri.com.conf /etc/nginx/sites-available/fpl.akilkhatri.com
#   sudo ln -s /etc/nginx/sites-available/fpl.akilkhatri.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d fpl.akilkhatri.com      # adds the 443 block + redirect, like your other sites
server {
  server_name fpl.akilkhatri.com;
  listen 80;

  # Avatar uploads are capped at 2 MB by the app; leave headroom for multipart overhead.
  client_max_body_size 5m;

  # Uploaded avatars live on the host (bind-mounted into the app container).
  location /avatars/ {
    alias /opt/fpl/avatars/;
    expires 7d;
    add_header Cache-Control "public";
    access_log off;
  }

  location / {
    proxy_pass http://127.0.0.1:3110;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Next compares a Server Action's Origin with this host, so it must be the public one.
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
