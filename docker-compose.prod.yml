# Production stack for the shared VPS (see docs/DEPLOYMENT_PLAN.md).
# nginx on the host terminates HTTPS and proxies to 127.0.0.1:3110.
# Run from /opt/fpl with: IMAGE_TAG=<git sha> docker compose -f docker-compose.prod.yml ...
name: fpl

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fantasy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: fantasy
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fantasy -d fantasy"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m

  migrate:
    image: ghcr.io/ak1239/sunday-league-fpl-migrator:${IMAGE_TAG:?Set IMAGE_TAG}
    profiles: ["tools"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://fantasy:${POSTGRES_PASSWORD}@db:5432/fantasy
    depends_on:
      db:
        condition: service_healthy

  app:
    image: ghcr.io/ak1239/sunday-league-fpl:${IMAGE_TAG:?Set IMAGE_TAG}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://fantasy:${POSTGRES_PASSWORD}@db:5432/fantasy
    ports:
      # Localhost only: nginx is the public entry point.
      - "127.0.0.1:3110:3000"
    volumes:
      # Uploaded avatars persist across deploys; nginx serves /avatars/ from here.
      - ./avatars:/app/public/avatars
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 768m

volumes:
  pgdata:
